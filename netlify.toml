[build]
  # Base directory where admin_web lives (relative to repo root)
  base    = "admin_web"
  # Build command
  command = "npm run build"
  # For modern Next.js deployments on Netlify, do not specify the 'publish' directory.
  # Netlify's Next.js runtime automatically detects and handles it.

[build.environment]
  # Node version to match local development
  NODE_VERSION = "20"

# Note: The @netlify/plugin-nextjs is no longer needed in netlify.toml for recent versions
# of Next.js, as Netlify provides native support.
# We also removed the manual wildcard redirect to '___netlify-handler' because
# Netlify's V5 Next.js runtime uses different handler architecture, and manual
# redirects will break routing and cause 404 errors.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
