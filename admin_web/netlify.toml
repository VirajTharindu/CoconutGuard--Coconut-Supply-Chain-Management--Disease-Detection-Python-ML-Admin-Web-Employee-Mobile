# netlify.toml — Netlify build & deploy configuration

[build]
  # Base directory where admin_web lives (relative to repo root)
  base    = "admin_web"
  # Build command
  command = "npm run build"
  # Next.js output directory (Netlify's Next.js runtime reads from .next)
  publish = ".next"

[build.environment]
  # Node version to match local development
  NODE_VERSION = "20"

# Use Netlify's official Next.js runtime plugin for full SSR support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all routes to Next.js (handled by the plugin, but kept as fallback)
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/___netlify-handler"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
